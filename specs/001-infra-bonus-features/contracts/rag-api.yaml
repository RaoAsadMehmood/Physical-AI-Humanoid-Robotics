openapi: 3.0.0
info:
  title: RAG Chatbot API
  description: API for the Retrieval Augmented Generation chatbot system
  version: 1.0.0
servers:
  - url: https://api.physical-ai-humanoid-robotics.com/v1
    description: Production server
  - url: https://staging-api.physical-ai-humanoid-robotics.com/v1
    description: Staging server

paths:
  /chat/sessions:
    post:
      summary: Create a new chat session
      description: Creates a new chat session for the user
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                language_preference:
                  type: string
                  default: 'en'
                  description: Language for the chat session
      responses:
        '201':
          description: Chat session created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: '#/components/schemas/ChatSession'
        '401':
          description: Unauthorized

  /chat/sessions/{sessionId}/messages:
    post:
      summary: Send message to chatbot
      description: Sends a message to the RAG chatbot and receives a response
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
          description: ID of the chat session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: The user's message/query
                include_sources:
                  type: boolean
                  default: true
                  description: Whether to include source citations in response
      responses:
        '200':
          description: Chat response received successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/ChatMessage'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded

  /chat/sessions/{sessionId}:
    get:
      summary: Get chat session
      description: Retrieves a specific chat session with its messages
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
          description: ID of the chat session
      responses:
        '200':
          description: Chat session retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: '#/components/schemas/ChatSession'
        '401':
          description: Unauthorized
        '404':
          description: Session not found

  /chat/sessions:
    get:
      summary: Get user's chat sessions
      description: Retrieves all chat sessions for the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Maximum number of sessions to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of sessions to skip
      responses:
        '200':
          description: Chat sessions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatSession'
        '401':
          description: Unauthorized

  /search:
    post:
      summary: Semantic search in documentation
      description: Performs semantic search across the Physical AI & Humanoid Robotics documentation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: Search query
                top_k:
                  type: integer
                  default: 5
                  maximum: 10
                  description: Number of results to return
                filters:
                  type: object
                  description: Filters for search results
                  properties:
                    content_type:
                      type: array
                      items:
                        type: string
                        enum: [chapter, lesson, section]
                    min_relevance:
                      type: number
                      minimum: 0
                      maximum: 1
                      default: 0.5
      responses:
        '200':
          description: Search results returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
        '400':
          description: Invalid query
        '401':
          description: Unauthorized

  /content/translate:
    post:
      summary: Translate content to target language
      description: Translates documentation content to the specified language
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content_id
                - target_language
              properties:
                content_id:
                  type: string
                  description: ID of the content to translate
                target_language:
                  type: string
                  description: Target language code (e.g., 'ur' for Urdu)
                force_refresh:
                  type: boolean
                  default: false
                  description: Whether to force re-translation if cached version exists
      responses:
        '200':
          description: Content translated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  translated_content:
                    $ref: '#/components/schemas/TranslationSet'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Content not found

  /content/languages:
    get:
      summary: Get available languages
      description: Returns all available languages for content translation
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Available languages retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  languages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Language'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ChatSession:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
          description: Null for anonymous sessions
        session_token:
          type: string
          description: Token for anonymous sessions
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        title:
          type: string
        is_active:
          type: boolean
        language_preference:
          type: string
          default: 'en'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'

    ChatMessage:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        created_at:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceCitation'
        model_used:
          type: string
        tokens_used:
          type: integer

    SourceCitation:
      type: object
      properties:
        content_id:
          type: string
        title:
          type: string
        url:
          type: string
        relevance_score:
          type: number
          minimum: 0
          maximum: 1
        snippet:
          type: string
          description: Relevant text snippet from source

    SearchResult:
      type: object
      properties:
        content_id:
          type: string
        title:
          type: string
        content_type:
          type: string
          enum: [chapter, lesson, section]
        url:
          type: string
        relevance_score:
          type: number
          minimum: 0
          maximum: 1
        snippet:
          type: string
        metadata:
          type: object

    TranslationSet:
      type: object
      properties:
        id:
          type: string
        source_content_id:
          type: string
        target_language:
          type: string
        translated_title:
          type: string
        translated_content:
          type: string
        translation_status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Language:
      type: object
      properties:
        code:
          type: string
          description: Language code (e.g., 'en', 'ur')
        name:
          type: string
          description: Full language name
        native_name:
          type: string
          description: Name in the language itself
        is_rtl:
          type: boolean
          description: Whether the language is right-to-left
        is_available:
          type: boolean
          description: Whether translation is available