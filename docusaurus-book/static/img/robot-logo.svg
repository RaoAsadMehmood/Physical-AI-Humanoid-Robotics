<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Robot head -->
  <rect x="30" y="20" width="40" height="40" rx="5" fill="none" stroke="#9a4eae" stroke-width="2"/>

  <!-- Robot eyes -->
  <circle cx="40" cy="35" r="3" fill="#9a4eae"/>
  <circle cx="60" cy="35" r="3" fill="#9a4eae"/>

  <!-- Robot mouth -->
  <rect x="45" y="45" width="10" height="3" rx="1" fill="#9a4eae"/>

  <!-- Robot body -->
  <rect x="35" y="60" width="30" height="25" rx="3" fill="none" stroke="#9a4eae" stroke-width="2"/>

  <!-- Antenna -->
  <line x1="50" y1="15" x2="50" y2="10" stroke="#9a4eae" stroke-width="2"/>
  <circle cx="50" cy="10" r="2" fill="#9a4eae"/>

  <!-- Decorative circuit lines -->
  <path d="M35 70 h20" stroke="#9a4eae" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M35 75 h15" stroke="#9a4eae" stroke-width="1" stroke-dasharray="2,2"/>
</svg>